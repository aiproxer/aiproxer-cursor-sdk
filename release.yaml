# Connector release metadata — packaging indexes are generated from this file.
schema: golip.connector.release/v1
plugin_id: io.golip.backend.cursorsdk
factory_kind: cursorsdk
module: github.com/aiproxer/aiproxer-cursor-sdk
command: ./cmd/lip-backend-cursorsdk
manifest_template: manifest/template.backendplugin.json
version: 0.1.0
build_id: localdev
tag: cursorsdk-v0.1.0
profiles:
  - full
# The published Go-LIP modules this plugin is pinned to. Their exact versions are read
# from go.mod at packaging time, because that is the manifest `go build` resolved: a
# version written here could drift from the build without anything noticing, and the
# record inside every archive would name a contract the bytes were never built from.
published_root_module: github.com/matdev83/go-llm-interactive-proxy
published_acp_module: github.com/matdev83/go-llm-interactive-proxy/connector-support/acp
replace_policy: released-dependency-pins-no-replace
private_companions:
  - bridge-node

# Host certification posture. A downloadable Go-LIP host release exists, this plugin has
# been certified against it through the real host binary on both platforms the manifest
# declares, and the measured platform difference in companion resolution is the adopted
# per-platform installation contract rather than an incompatibility.
#
# The certified evidence is declared here, one entry per declared platform, rather than
# typed into a packaging command: each entry names the host project and release, the asset
# that release published, the binary inside it, the measured sha256 of that binary, and the
# companion contract this platform supports. The renderer copies that into every archive's
# compatibility.json and refuses a certified posture with a missing, malformed, duplicated,
# or undeclared-platform entry, so a published artifact cannot name host evidence this
# repository does not record. scripts/package-plugin still accepts --tested-host: it is now
# an assertion about what the run measured, checked against this declaration rather than
# recorded in place of it.
#
# Evidence: docs/certification.md, "Requirement 3.1, 3.2, 3.3, 3.4, 4.5, 6.1", produced by
# TestHostReleaseCertification_RealHostInstallTrustAndOptionalActivation against
# go-llm-interactive-proxy v0.1.0, 15/15 cases on each platform. Publication is produced by
# .github/workflows/release.yml from this tag, and each leg of that matrix re-runs the gate
# against the archive it is about to publish.
host_certification: certified
certified_host_artifacts:
  - platform: windows/amd64
    host_project: github.com/matdev83/go-llm-interactive-proxy
    host_version: v0.1.0
    host_release_asset: go-llm-interactive-proxy_0.1.0_windows_amd64.zip
    host_checksums_asset: checksums.txt
    host_binary: lipstd.exe
    host_artifact_sha256: 6a6f7462d94bd3c5fae16e799e10ec236bfc116c86baaca19544dc3fed6b20c4
    # The host verifies the outer executable's digest and then launches a private staged
    # copy of it from a digest-addressed staging directory, so the packaged default
    # companion path cannot reach the installed launcher. An explicit bridge_executable
    # pointing at the installed launcher is the supported configuration here, and an unset
    # path fails as an explicit prerequisite naming that field.
    companion_contract: explicit-bridge_executable-required
  - platform: linux/amd64
    host_project: github.com/matdev83/go-llm-interactive-proxy
    host_version: v0.1.0
    host_release_asset: go-llm-interactive-proxy_0.1.0_linux_amd64.tar.gz
    host_checksums_asset: checksums.txt
    host_binary: lipstd
    host_artifact_sha256: ce52b7e3f02c12ce00f67eac6b0ee8a038af17d0f62b15ee8e11e34d130b7d3c
    # The host binds the verified install-root executable by descriptor and execs it, so
    # os.Executable() inside the plugin is the installed path and the packaged default
    # companion resolves with no operator action. An explicit bridge_executable is accepted
    # there too and is optional.
    companion_contract: packaged-default-supported
