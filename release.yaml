# Connector release metadata — packaging indexes are generated from this file.
schema: golip.connector.release/v1
plugin_id: io.golip.backend.cursorsdk
factory_kind: cursorsdk
module: github.com/aiproxer/aiproxer-cursor-sdk
command: ./cmd/lip-backend-cursorsdk
manifest_template: manifest/template.backendplugin.json
version: 0.1.0
build_id: localdev
tag: cursorsdk-v0.1.0
profiles:
  - full
# The published Go-LIP modules this plugin is pinned to. Their exact versions are read
# from go.mod at packaging time, because that is the manifest `go build` resolved: a
# version written here could drift from the build without anything noticing, and the
# record inside every archive would name a contract the bytes were never built from.
published_root_module: github.com/matdev83/go-llm-interactive-proxy
published_acp_module: github.com/matdev83/go-llm-interactive-proxy/connector-support/acp
replace_policy: released-dependency-pins-no-replace
private_companions:
  - bridge-node

# Host certification posture. A downloadable Go-LIP host release exists, this plugin has
# been certified against it through the real host binary on both platforms the manifest
# declares, and the measured platform difference in companion resolution is now the adopted
# per-platform installation contract rather than an incompatibility. The posture is still
# `uncertified` because this release is not published yet, so there is no release artifact to
# certify and compatibility.json carries no host artifact digest.
#
# This is a declared decision rather than an absent key: an archive has to say which of the
# two postures it holds. Certifying a release flips this to `certified`, empties
# host_certification_reason, and passes one -tested-host <sha256> per host artifact to
# scripts/package-plugin, which validates each digest. Neither a digest nor a certification
# is ever invented.
#
# Evidence: docs/certification.md, "Requirement 3.1, 3.2, 3.3, 3.4, 4.5, 6.1", produced by
# TestHostReleaseCertification_RealHostInstallTrustAndOptionalActivation against
# go-llm-interactive-proxy v0.1.0.
host_certification: uncertified
host_certification_reason: >-
  measured against Go-LIP v0.1.0 on windows/amd64 and linux/amd64 and passing on both under
  the adopted per-platform companion-path contract: the packaged default companion resolution
  is measured working on linux/amd64 and measured unreachable on windows/amd64, because there
  the host verifies the outer executable digest and then launches a private staged copy of it
  from a digest addressed staging directory, so private/bridge/lip-cursor-sdk-bridge.exe cannot
  be reached relative to the installed executable; that measured difference is the contract
  rather than a defect, so an explicit bridge_executable path to the installed private launcher
  is the supported configuration on windows/amd64 and the packaged default stays supported on
  linux/amd64, and the plugin reports the unset Windows path as an explicit prerequisite naming
  bridge_executable rather than searching for or provisioning one; certification still waits
  on publication, because this release is not published yet and has no release artifact to
  certify, so no host artifact digest is recorded and none is invented
