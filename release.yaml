# Connector release metadata — packaging indexes are generated from this file.
schema: golip.connector.release/v1
plugin_id: io.golip.backend.cursorsdk
factory_kind: cursorsdk
module: github.com/aiproxer/aiproxer-cursor-sdk
command: ./cmd/lip-backend-cursorsdk
manifest_template: manifest/template.backendplugin.json
version: 0.2.0
build_id: localdev
tag: cursorsdk-v0.2.0
profiles:
  - full
# The published Go-LIP modules this plugin is pinned to. Their exact versions are read
# from go.mod at packaging time, because that is the manifest `go build` resolved: a
# version written here could drift from the build without anything noticing, and the
# record inside every archive would name a contract the bytes were never built from.
published_root_module: github.com/matdev83/go-llm-interactive-proxy
published_acp_module: github.com/matdev83/go-llm-interactive-proxy/connector-support/acp
replace_policy: released-dependency-pins-no-replace
private_companions:
  - bridge-node

# Host certification posture. This source tree is deliberately uncertified: the
# packaged manifest declares the v2 credential contract and no host release
# carrying the v2 credential-contract ABI exists yet, so no archive from this
# source can be certified. The release workflow refuses to publish an
# uncertified revision, which is the point: publication waits for a host
# release the new manifest parses against, a re-run of the real-host gate
# against that artifact on both declared platforms, and this record flipped
# back to certified with per-platform entries.
#
# The certified shape is unchanged: each entry names the host project and
# release, the asset that release published, the binary inside it, the measured
# sha256 of that binary, and the companion contract this platform supports.
# The renderer copies that into every archive's compatibility.json and refuses
# a certified posture with a missing, malformed, duplicated, or
# undeclared-platform entry, so a published artifact cannot name host evidence
# this repository does not record. scripts/package-plugin still accepts
# --tested-host: it is an assertion about what the run measured, checked
# against that declaration rather than recorded in place of it. The last
# certified evidence (host v0.1.0, 15/15 cases per platform) is recorded in
# docs/certification.md and remains the evidence for the published
# cursorsdk-v0.1.0 archives only; it does not cover the v2 manifest.
host_certification: uncertified
host_certification_reason: the packaged manifest declares the v2 credential contract, which the last certified host release (matdev83/go-llm-interactive-proxy v0.1.0) cannot parse on either declared platform (windows/amd64, linux/amd64); no host release carrying the v2 credential-contract ABI exists yet, so no archive from this source can be certified. Certification will be re-established against that host release, and the release metadata re-certified with per-platform artifacts, before publication.
