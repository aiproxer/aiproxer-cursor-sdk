name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    name: go (GOWORK=off, released contracts only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The plugin module is standalone: it must resolve its published Go-LIP
      # dependencies on its own, never through a workspace file or a sibling
      # checkout.
      GOWORK: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      # A replace directive would mean the build no longer proves that released
      # contracts resolve on their own, so a dirty go.mod fails the lane.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  go-race:
    name: go -race (launcher and bridge lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same standalone-module contract as the go lane; the race detector is
      # Linux-only here, so this lane is the Linux race evidence for the private
      # runtime launcher and the bridge lifecycle suites.
      GOWORK: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      # The launcher owns a live process descendant, forwards its streams, and
      # settles it exactly once, so its lifecycle and the bridge lifecycle suites
      # that supervise processes are verified under the race detector.
      - name: Race test launcher and bridge lifecycle
        run: go test -race ./cmd/lip-cursor-sdk-bridge/... ./internal/product/... .

  bridge-node:
    name: bridge-node
    # The SDK bridge now lives in this repository together with its production
    # lockfile, so the plugin owns its own SDK and JavaScript dependency
    # security verification and the Go-LIP host runs no Node tooling. The lane
    # keeps the host's proven sequence on the host's exact Node 22.22.3
    # baseline: `npm ci`, `npm test`, `npm run typecheck`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each job runs in its own workspace, so the lane needs its own checkout.
      # Without it the npm steps would run against an empty directory with no
      # bridge source, manifest, or lockfile.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node (22.22.3)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: bridge-node/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge-node
        run: npm ci

      - name: Bridge unit tests
        working-directory: bridge-node
        run: npm test

      - name: Bridge typecheck
        working-directory: bridge-node
        run: npm run typecheck

  package:
    name: package (${{ matrix.os }})
    # The archive carries the plugin-private Node runtime, so it can only be trusted
    # where it was assembled and actually run. Each leg of this matrix therefore
    # validates exactly one platform - its own - and the packager refuses to
    # cross-compile a platform claim. Both legs are native runners, because a
    # cross-compiled archive has never had its private runtime run: the matrix exists
    # so the Windows/amd64 claim has enforced CI evidence of its own rather than a
    # maintainer's word, not to multiply claims.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GOWORK: "off"
      # The gate assembles a real archive (production JavaScript, a private Node
      # runtime) and resolves the Cursor SDK over the network exactly as an operator
      # does, so it is opt-in rather than part of the default unit lane, and this lane
      # is what opts in.
      LIP_PACKAGE_GATE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Packaging is a build-time operation: npm builds the production JavaScript and
      # stages the private Node runtime from the runner's Node toolchain. Nothing the
      # assembled archive needs at run time is looked up on PATH, and no
      # third-party package code ships in it: the operator provisions the Cursor SDK
      # against the runtime the archive carries.
      - name: Setup Node (22.22.3)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: bridge-node/package-lock.json

      - name: Download modules
        run: go mod download

      # Assembles the archive, audits it as a released artifact, provisions it the way
      # an operator does, and fails on an archive carrying the SDK, an unprovisioned
      # installed tree, a provisioned tree at the wrong SDK version, a tampered or
      # missing shipped file, a checksum record covering operator-provisioned files, an
      # unlisted or missing shipped file, a platform overclaim, a missing companion, an
      # install root containing spaces, or any dependence on a global Node.
      #
      # -timeout is raised off Go's 10m default on purpose. The gate verifies an
      # assembled tree about twenty times (every way a package can lie has to be
      # shown to fail), each verification walks and digests the whole tree, and one
      # verification resolves the SDK over the network. Ten minutes is not a budget
      # this lane can meet, and a lane that panics on the default reports no platform
      # evidence at all. It stays inside the job's own 45m ceiling so a slow run is a
      # failure with a real report rather than a kill.
      - name: Native package platform validation
        run: go test -count=1 -timeout 40m -run TestPackageArchive -v .
