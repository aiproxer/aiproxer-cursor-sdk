name: Verify

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  # Push and PR events for the same branch share a group, avoiding duplicate runs.
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    name: go (GOWORK=off, released contracts only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The plugin module is standalone: it must resolve its published Go-LIP
      # dependencies on its own, never through a workspace file or a sibling
      # checkout.
      GOWORK: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Verify module checksums
        run: go mod verify

      # A replace directive would mean the build no longer proves that released
      # contracts resolve on their own, so a dirty go.mod fails the lane.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  go-race:
    name: go -race (launcher and bridge lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same standalone-module contract as the go lane; the race detector is
      # Linux-only here, so this lane is the Linux race evidence for the private
      # runtime launcher and the bridge lifecycle suites.
      GOWORK: "off"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      # The launcher owns a live process descendant, forwards its streams, and
      # settles it exactly once, so its lifecycle and the bridge lifecycle suites
      # that supervise processes are verified under the race detector.
      - name: Race test launcher and bridge lifecycle
        run: go test -race ./cmd/lip-cursor-sdk-bridge/... ./internal/product/... .

  bridge-node:
    name: bridge-node
    # The SDK bridge now lives in this repository together with its production
    # lockfile, so the plugin owns its own SDK and JavaScript dependency
    # security verification and the Go-LIP host runs no Node tooling. The lane
    # keeps the host's proven sequence on the host's exact Node 22.22.3
    # baseline: `npm ci`, `npm test`, `npm run typecheck`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Each job runs in its own workspace, so the lane needs its own checkout.
      # Without it the npm steps would run against an empty directory with no
      # bridge source, manifest, or lockfile.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node (22.22.3)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: bridge-node/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge-node
        run: npm ci

      - name: Bridge unit tests
        working-directory: bridge-node
        run: npm test

      - name: Bridge typecheck
        working-directory: bridge-node
        run: npm run typecheck