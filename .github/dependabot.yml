version: 2
updates:
  # The plugin module depends only on released Go-LIP modules. There are no
  # sibling checkout replacements, so the root directory is the whole module
  # stream today; additional directories arrive with relocated Go modules.
  - package-ecosystem: gomod
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      go-patch:
        patterns:
          - "*"
        update-types:
          - patch
      go-minor:
        patterns:
          - "*"
        update-types:
          - minor

  # The Cursor SDK bridge now lives in this repository with its production
  # lockfile, so SDK and JavaScript dependency updates are maintained here
  # independently of the Go-LIP host, which must stay free of npm tooling.
  - package-ecosystem: npm
    directories:
      - /bridge-node
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      # Enforce the policy below instead of only restating it. Without this,
      # Dependabot classified `@cursor/sdk` 1.0.23 -> 1.0.40 as a semver patch,
      # swept the exact pin into `npm-patch`, and opened #4 - which cannot pass
      # the bridge and package lanes that assert the certified baseline. The
      # SDK moves only through a deliberate, re-certified upgrade.
      - dependency-name: "@cursor/sdk"
      # The `undici` override is a release decision, not an update stream.
      - dependency-name: "undici"
      # `@types/node` must describe the oldest runtime the bridge supports
      # (engines `>=22.13`, CI Node 22.22.3); a newer major would type APIs
      # that runtime does not have.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # The certified baseline is deliberately not automated: `@cursor/sdk` is
      # an exact pin and the `undici` security override is a release decision,
      # so neither moves through an unattended update. Only the bridge's own
      # development tooling is grouped here. The `ignore` block above is the
      # enforcement of that sentence, not a duplicate of it.
      npm-patch:
        patterns:
          - "*"
        update-types:
          - patch
      npm-minor:
        patterns:
          - "*"
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
